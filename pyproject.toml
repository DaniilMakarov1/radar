[project]
name = "smart-money-radar"
version = "0.1.0"
description = "Research-first on-chain screener for early smart-money accumulation before public hype and potential Binance listings."
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
smr = "smart_money_radar.cli:main"

[tool.setuptools.packages.find]
include = ["smart_money_radar*"]
exclude = ["config*", "queries*", "warehouse*", "scripts*", "tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
