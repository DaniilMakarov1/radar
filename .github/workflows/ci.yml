name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - review/synchronized-funding-v2-qwen-20260728-075432

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile check
        run: |
          python -m py_compile \
            smart_money_radar/paper_bot/runtime_v2.py \
            smart_money_radar/funding/route_identity.py \
            smart_money_radar/funding/readiness_policy.py \
            smart_money_radar/funding/trader.py \
            smart_money_radar/funding/strategy_synchronized_funding.py \
            smart_money_radar/funding/stablecoins.py \
            smart_money_radar/funding/shadow_monitor.py \
            smart_money_radar/funding/fees.py \
            smart_money_radar/storage.py
      - name: Targeted synchronized funding and shadow tests
        run: python -m pytest tests/test_synchronized_funding_v2.py tests/test_funding_shadow_monitor.py -q
      - name: Reconciliation tests
        run: python -m pytest tests/test_reconciliation_worker.py -q
      - name: Full pytest suite
        run: python -m pytest -q
      - name: Single-cycle paper MVP scenario
        run: python scripts/run_synchronized_funding_paper_mvp.py
      - name: Two independent captures paper MVP scenario
        run: python scripts/run_synchronized_funding_two_capture_paper_mvp.py
      - name: Diff check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
